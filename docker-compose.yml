version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clipforge-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clipforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clipforge-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipforge-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      USE_LOCAL_QUEUE: "False"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipforge-celery-worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

